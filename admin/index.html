<!doctype html>
<html lang="es-BO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Backoffice · Chicken's Kingdom</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1d1512">
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="boot" class="boot"><img src="../assets/img/logo.png" alt="" width="72" height="72"><p>Cargando…</p></div>

  <section id="login" class="login" hidden>
    <form class="login__card" id="loginForm">
      <img src="../assets/img/logo.png" alt="Chicken's Kingdom" width="84" height="84">
      <h1>Backoffice</h1>
      <p class="muted">Solo para el equipo de Chicken's Kingdom.</p>
      <label>Correo<input type="email" id="loginEmail" autocomplete="username" required></label>
      <label>Contraseña<input type="password" id="loginPw" autocomplete="current-password" required minlength="8"></label>
      <p class="err" id="loginErr" aria-live="polite"></p>
      <button class="btn btn--red btn--block" type="submit">Entrar</button>
    </form>
  </section>

  <section id="setup" class="login" hidden>
    <div class="login__card">
      <img src="../assets/img/logo.png" alt="" width="84" height="84">
      <h1>Falta conectar la base de datos</h1>
      <p>Para usar el backoffice, completa <code>supabaseUrl</code> y <code>publishableKey</code> en <code>js/config.js</code> y vuelve a publicar. Los pasos están en el README.</p>
      <a class="btn btn--red btn--block" href="../">Volver a la página</a>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <aside class="side">
      <a class="side__brand" href="#/"><img src="../assets/img/logo.png" alt="" width="36" height="36"><span>Kingdom<small>Backoffice</small></span></a>
      <nav class="side__nav" id="nav" aria-label="Secciones"></nav>
      <div class="side__me" id="me"></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="../js/config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
